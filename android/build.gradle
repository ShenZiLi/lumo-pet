# Android WebView 封装 · 构建指南
#
# 将本项目打包为 APK：
# 1. 在 Android Studio 中新建 Empty Activity 项目（包名 com.lumo.app）
# 2. 用本目录下的文件替换对应位置
# 3. 将 ai-pet/ 整个前端目录复制到 app/src/main/assets/lumo/
# 4. Build → Generate Signed Bundle / APK
#
# 快速命令（需要 Android SDK + Gradle 环境，此处不可编译但源码完整）：
#   cp -r /path/to/ai-pet android/app/src/main/assets/lumo
#   ./gradlew assembleRelease
#
# 最低 SDK: 24 (Android 7.0)
# 目标 SDK: 34 (Android 14)
# 权限: 网络、相机、位置

apply plugin: 'com.android.application'

android {
    namespace 'com.lumo.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.lumo.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
}
