plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.lumo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumo.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    // 签名配置：优先读取 CI 环境变量，缺失时回退到仓库内置演示密钥路径
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "${projectDir}/../keystore/lumo-release.keystore"
            storeFile file(ksPath)
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "lumo-release-2024"
            keyAlias System.getenv("KEY_ALIAS") ?: "lumo"
            keyPassword System.getenv("KEY_PASSWORD") ?: "lumo-release-2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
